name: Verify Manta dashboard
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: manta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build:vercel
      - run: npm test
      - run: docker build --tag manta-dashboard:check .
      - name: Verify root-mounted volume and both website routes
        run: |
          docker run -d --name manta-smoke --user 0 --tmpfs /data -e SESSION_SECRET=disposable-ci-session-secret-at-least-32-characters -e PUBLIC_URL=https://manta.example -p 127.0.0.1:3000:3000 manta-dashboard:check
          trap 'docker logs manta-smoke; docker rm -f manta-smoke' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/healthz
          curl --fail http://127.0.0.1:3000/ | grep -q 'Your server'
          curl --fail http://127.0.0.1:3000/dashboard | grep -q 'Server management'
          docker exec manta-smoke sh -c 'test "$(stat -c %u /data/manta.sqlite)" = 1000'
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/fai1th/manta-website
    steps:
      - uses: actions/checkout@v4
      - name: Build the verified commit
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$IMAGE:$GITHUB_SHA" --tag "$IMAGE:latest" .
      - name: Publish to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          docker logout ghcr.io
